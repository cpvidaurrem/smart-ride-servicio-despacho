
services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:17
    container_name: despacho-postgres
    environment:
      POSTGRES_DB: db_smartride_despacho
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: usuario123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - despacho-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U usuario -d db_smartride_despacho" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API del servicio de despacho
  despacho-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: despacho-api
    environment:
      - DATABASE_URL=postgresql://usuario:usuario123@postgres:5432/db_smartride_despacho
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=db_smartride_despacho
      - DB_USER=usuario
      - DB_PASSWORD=usuario123
      - PORT=8003
      - DEBUG=True
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - despacho-network
    restart: unless-stopped

volumes:
  postgres_data:


networks:
  despacho-network:
    driver: bridge
