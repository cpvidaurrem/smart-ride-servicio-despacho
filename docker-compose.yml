services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:latest
    container_name: despacho-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-despacho_db}
      POSTGRES_USER: ${DB_USER:-despacho_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-despacho_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-ride-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-despacho_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: despacho-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smart-ride-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (opcional, para caché)
  redis:
    image: redis:7-alpine
    container_name: despacho-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-ride-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API FastAPI
  despacho-api:
    build:
      context: .
      target: production
    container_name: despacho-api
    command: api
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-despacho_user}:${DB_PASSWORD:-despacho_pass}@postgres:5432/${DB_NAME:-despacho_db}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-despacho_db}
      - DB_USER=${DB_USER:-despacho_user}
      - DB_PASSWORD=${DB_PASSWORD:-despacho_pass}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8003
      - GRPC_PORT=50051
      - DEBUG=${DEBUG:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-ride-network
    restart: unless-stopped

  # Servidor gRPC
  despacho-grpc:
    build:
      context: .
      target: production
    container_name: despacho-grpc
    command: grpc
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-despacho_user}:${DB_PASSWORD:-despacho_pass}@postgres:5432/${DB_NAME:-despacho_db}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-despacho_db}
      - DB_USER=${DB_USER:-despacho_user}
      - DB_PASSWORD=${DB_PASSWORD:-despacho_pass}
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-ride-network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  smart-ride-network:
    driver: bridge