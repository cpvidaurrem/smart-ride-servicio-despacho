version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:latest
    container_name: despacho-postgres
    environment:
      POSTGRES_DB: despacho_db
      POSTGRES_USER: despacho_user
      POSTGRES_PASSWORD: despacho_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - despacho-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U despacho_user -d despacho_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API del servicio de despacho
  despacho-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: despacho-api
    environment:
      - DATABASE_URL=postgresql://despacho_user:despacho_pass@postgres:5432/despacho_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=despacho_db
      - DB_USER=despacho_user
      - DB_PASSWORD=despacho_pass
      - PORT=8003
      - DEBUG=True
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - despacho-network
    restart: unless-stopped

volumes:
  postgres_data:


networks:
  despacho-network:
    driver: bridge
