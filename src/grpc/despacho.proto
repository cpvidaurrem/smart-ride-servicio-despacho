syntax = "proto3";

package despacho;

// Servicio de Despacho para asignación de conductores
service DespachoService {
    // Confirmar asignación de conductor a viaje
    rpc ConfirmarAsignacion(AsignacionRequest) returns (AsignacionResponse);
    
    // Obtener conductor asignado a un viaje
    rpc ObtenerConductorAsignado(ViajeRequest) returns (ConductorResponse);
    
    // Cancelar asignación
    rpc CancelarAsignacion(CancelacionRequest) returns (CancelacionResponse);
    
    // Verificar disponibilidad de conductores
    rpc VerificarDisponibilidad(DisponibilidadRequest) returns (DisponibilidadResponse);
}

// Request para asignar un viaje
message AsignacionRequest {
    int32 id_viaje = 1;
    int32 id_pasajero = 2;
    string origen = 3;
    string destino = 4;
    int32 prioridad = 5;
    string algoritmo = 6;
}

// Response de asignación exitosa
message AsignacionResponse {
    bool exito = 1;
    string mensaje = 2;
    int32 id_asignacion = 3;
    ConductorInfo conductor = 4;
    int32 tiempo_asignacion_ms = 5;
}

// Información del conductor asignado
message ConductorInfo {
    int32 id_conductor = 1;
    string nombre_completo = 2;
    string modelo_auto = 3;
    string placa_auto = 4;
    float calificacion = 5;
    double ubicacion_lat = 6;
    double ubicacion_lng = 7;
}

// Request para obtener conductor de un viaje
message ViajeRequest {
    int32 id_viaje = 1;
}

// Response con información del conductor
message ConductorResponse {
    bool encontrado = 1;
    ConductorInfo conductor = 2;
    string estado_asignacion = 3;
}

// Request para cancelar asignación
message CancelacionRequest {
    int32 id_viaje = 1;
    string motivo = 2;
}

// Response de cancelación
message CancelacionResponse {
    bool exito = 1;
    string mensaje = 2;
}

// Request para verificar disponibilidad
message DisponibilidadRequest {
    string zona = 1;
}

// Response de disponibilidad
message DisponibilidadResponse {
    int32 conductores_disponibles = 1;
    bool hay_disponibilidad = 2;
}